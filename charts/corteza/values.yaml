## @section Gotenberg configuration
## @param gotenberg.enabled Enable the installation of the Gotenberg pdf renderer tool.
## @param gotenberg.name Name of the Gotenberg deployment.
## @param gotenberg.nameOverride The name to override the default name.
##
gotenberg:
  enabled: false
  name: gotenberg
  nameOverride: ""
  ## @param gotenberg.autoscaling.enabled Enable autoscaling for the installed gotenberg deployment.
  ## @param gotenberg.autoscaling.minReplicas The minimum number of replicas for the installed gotenberg deployment.
  ## @param gotenberg.autoscaling.maxReplicas The maximum number of replicas for the installed gotenberg deployment.
  ## @param gotenberg.autoscaling.targetCPUUtilizationPercentage The target CPU utilization percentage for autoscaling.
  ##
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  ## @param gotenberg.image.repository Image repository for the Gotenberg container image.
  ## @param gotenberg.image.tag Image tag for the Gotenberg container image.
  ## @param gotenberg.image.imagePullPolicy Image pull policy for the Gotenberg container image.
  ##
  image:
    repository: gotenberg/gotenberg
    tag: "8"
    imagePullPolicy: IfNotPresent
  ## @param gotenberg.startupProbe Startup probe for the Gotenberg container. Set to `{}` to disable.
  ## Gotenberg 7 and above expose the health check on `/health`, older 6.x images used `/ping`.
  ##
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30
  ## @param gotenberg.livenessProbe Liveness probe for the Gotenberg container. Set to `{}` to disable.
  ##
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param gotenberg.readinessProbe Readiness probe for the Gotenberg container. Set to `{}` to disable.
  ##
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param gotenberg.service.type Service type for the Gotenberg service.
  ## @param gotenberg.service.port Service port for the Gotenberg service.
  ## @param gotenberg.service.containerPort Service port for the Gotenberg container.
  service:
    type: ClusterIP
    port: 3000
    containerPort: 3000
  ## @param gotenberg.serviceAccount.create Specifies whether a service account should be created.
  ## @param gotenberg.serviceAccount.annotations Annotations to add to the service account.
  ## @param gotenberg.serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template.
  ##
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  ## @param gotenberg.replicaCount The required number of replicas for the installed Gotenberg deployment. replicaCount is only used when autoscaling is not enabled.
  ##
  replicaCount: 1
  ## @param gotenberg.initContainers Add additional init containers to the Gotenberg pods.
  ##
  initContainers: []
  ## @param gotenberg.imagePullSecrets Specify docker-registry secret names as an array. The specified secrets MUST be in the same namespace.
  ##
  imagePullSecrets: []
  ## @param gotenberg.podAnnotations Annotations for the Gotenberg pods.
  ##
  podAnnotations: {}
  ## @param gotenberg.podSecurityContext Security context for the Gotenberg pods.
  ##
  podSecurityContext: {}
    # fsGroup: 2000
  ## @param gotenberg.securityContext Security context for the Gotenberg container.
  ##
  securityContext: {}
  ## @param gotenberg.resources Resource limits and requests for the Gotenberg server pods.
  ## ref: https://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
  ##
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  ## @param gotenberg.nodeSelector Node labels for pod assignment.
  ## @param gotenberg.tolerations Tolerations for pod assignment.
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ## @param gotenberg.affinity Affinity settings for pod assignment.
  ##
  nodeSelector: {}
  tolerations: []
  affinity: {}

## @section PostgreSQL configuration
## @descriptionStart
## Configuring an external database overrides postgresql configuration.
## @descriptionEnd
## @param postgresql.enabled Enable the installation of PostgreSQL database.
##
postgresql:
  enabled: true
  ## @param postgresql.auth.enablePostgresUser Enable creating a PostgreSQL user.
  ## @param postgresql.auth.username Username of the PostgreSQL user.
  ## @param postgresql.auth.password Password of the PostgreSQL user.
  ## @param postgresql.auth.database Database name to use.
  ##
  auth:
    enablePostgresUser: true
    username: "corteza"
    password: "corteza"
    database: "corteza"
  ## @param postgresql.extraConnParams Extra connection parameters to add to the DB DSN query string. Each key-value pair is added as-is. A value for `sslmode` replaces the default `disable`.
  ## e.g:
  ## extraConnParams:
  ##   pool_max_conns: "20"
  ##
  extraConnParams: {}
  ## @param postgresql.architecture TODO
  architecture: standalone
  ## @param postgresql.global.postgresql.service.ports.postgresql Port to listen on for PostgreSQL server.
  global:
    postgresql:
      service:
        ports:
          postgresql: "5432"

## @section CloudNativePG configuration
## @descriptionStart
## Deploys a CloudNativePG `Cluster` custom resource for Corteza. The CloudNativePG operator must be installed in the cluster separately.
## When enabled, Corteza connects to the `<clusterName>-rw` service with the credentials of the operator generated `<clusterName>-app` secret.
## Disable `postgresql.enabled` when this is enabled.
## @descriptionEnd
## @param cnpg.enabled Deploy a CloudNativePG Cluster and use it as the Corteza database.
## @param cnpg.clusterName Name of the Cluster resource. Defaults to `<release name>-pg`.
## @param cnpg.namespace Namespace of the Cluster and the pg_dump resources. Defaults to the release namespace. Requires `cnpg.appSecret.existingSecret` when it differs.
## @param cnpg.appSecret.existingSecret Existing `kubernetes.io/basic-auth` secret with the owner credentials (`username`, `password`), used for `bootstrap.initdb.secret`. When empty, the operator generates `<clusterName>-app`. With a different `cnpg.namespace`, create it in both namespaces with the same content.
## @param cnpg.annotations Annotations of the Cluster resource (for example `argocd.argoproj.io/sync-options: Delete=false`).
## @param cnpg.enablePDB Create a PodDisruptionBudget for the primary. Set it to `false` for single-instance clusters, otherwise node drains are blocked.
## @param cnpg.instances Number of PostgreSQL instances (1 primary + n-1 replicas).
## @param cnpg.imageName PostgreSQL operand image. Pin it to a digest in production.
## @param cnpg.imagePullPolicy PostgreSQL image pull policy.
## @param cnpg.primaryUpdateStrategy Primary update strategy (`unsupervised` or `supervised`).
## @param cnpg.enableSuperuserAccess Create the `<clusterName>-superuser` secret and allow `postgres` user login over the network.
## @param cnpg.database Name of the application database.
## @param cnpg.owner Owner of the application database. Corteza connects as this user.
## @param cnpg.extraConnParams Extra connection parameters to add to the DB DSN query string. A value for `sslmode` replaces the default `require`.
## @param cnpg.inheritedMetadata Labels and annotations inherited by every resource generated by the operator.
## @param cnpg.postgresql.parameters PostgreSQL configuration parameters (`postgresql.conf`).
## @param cnpg.postgresql.sharedPreloadLibraries Additional libraries to preload. The operator adds `pg_stat_statements`, `pgaudit` and `auto_explain` automatically when their parameters are set.
## @param cnpg.managedRoles Roles managed declaratively by the operator (`.spec.managed.roles`).
## @param cnpg.storage.size Size of the PGDATA volume.
## @param cnpg.storage.storageClass Storage class of the PGDATA volume.
## @param cnpg.walStorage.enabled Use a separate volume for WAL files.
## @param cnpg.walStorage.size Size of the WAL volume.
## @param cnpg.walStorage.storageClass Storage class of the WAL volume.
## @param cnpg.resources Resource requests and limits of the PostgreSQL instances.
## @param cnpg.affinity Affinity configuration of the Cluster (`.spec.affinity`, supports `nodeSelector`, `tolerations` and `enablePodAntiAffinity`).
##
cnpg:
  enabled: false
  clusterName: ""
  namespace: ""
  appSecret:
    existingSecret: ""
  annotations: {}
  enablePDB: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-bookworm
  imagePullPolicy: IfNotPresent
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  database: corteza
  owner: corteza
  extraConnParams: {}
  inheritedMetadata: {}
  postgresql:
    parameters:
      max_connections: "200"
    sharedPreloadLibraries: []
  managedRoles: []
  storage:
    size: 8Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  resources: {}
  affinity: {}
  ## @param cnpg.import.enabled Import the database from an existing PostgreSQL server during bootstrap (`initdb.import`, microservice type). Only evaluated when the Cluster is created.
  ## @param cnpg.import.database Name of the database to import from the source.
  ## @param cnpg.import.host Host of the source PostgreSQL server.
  ## @param cnpg.import.port Port of the source PostgreSQL server.
  ## @param cnpg.import.user User that connects to the source. Must be able to run `pg_dump` on the database (superuser is recommended).
  ## @param cnpg.import.dbname Database used for the initial connection to the source.
  ## @param cnpg.import.sslmode SSL mode of the connection to the source.
  ## @param cnpg.import.passwordSecret.name Name of the secret containing the password of the source user.
  ## @param cnpg.import.passwordSecret.key Key in the secret containing the password of the source user.
  ## @param cnpg.import.postImportApplicationSQL SQL statements executed in the application database after the import.
  ##
  import:
    enabled: false
    database: corteza
    host: ""
    port: "5432"
    user: postgres
    dbname: postgres
    sslmode: disable
    passwordSecret:
      name: ""
      key: ""
    postImportApplicationSQL: []
  ## @param cnpg.backup.enabled Create a CronJob that writes a logical dump (`pg_dump`) of the application database to a PVC.
  ## @param cnpg.backup.schedule Cron schedule of the dump.
  ## @param cnpg.backup.timeZone Time zone of the schedule.
  ## @param cnpg.backup.retentionDays Dumps older than this many days are deleted by the default command.
  ## @param cnpg.backup.image Image of the dump job. Defaults to `cnpg.imageName` so the client matches the server version.
  ## @param cnpg.backup.command Override the container command. The environment provides `PGHOST`, `PGPORT`, `PGDATABASE`, `PGUSER`, `PGPASSWORD`, `PGSSLMODE`, `PGDUMP_DIR` and `RETENTION_DAYS`.
  ## @param cnpg.backup.successfulJobsHistoryLimit Number of successful jobs to keep.
  ## @param cnpg.backup.failedJobsHistoryLimit Number of failed jobs to keep.
  ## @param cnpg.backup.podAnnotations Annotations of the dump job pods.
  ## @param cnpg.backup.nodeSelector Node labels for the dump job pods.
  ## @param cnpg.backup.tolerations Tolerations for the dump job pods.
  ## @param cnpg.backup.resources Resource requests and limits of the dump job.
  ## @param cnpg.backup.storage.existingClaim Use an existing PVC for the dumps (e.g. the Bitnami `<release>-postgresql-pgdumpall` PVC). Dumps are written to the root of the volume.
  ## @param cnpg.backup.storage.claimName Name of the PVC created by the chart (default `<cluster>-pgdump`). Set it to the name of an existing PVC to let the chart manage that PVC; size, storage class and access modes must match it.
  ## @param cnpg.backup.storage.size Size of the dump PVC.
  ## @param cnpg.backup.storage.storageClass Storage class of the dump PVC.
  ## @param cnpg.backup.storage.accessModes Access modes of the dump PVC.
  ## @param cnpg.backup.storage.keep Keep the dump PVC when the release is deleted.
  ## @param cnpg.backup.storage.labels Extra labels of the dump PVC.
  ## @param cnpg.backup.storage.annotations Extra annotations of the dump PVC.
  ##
  backup:
    enabled: false
    schedule: "40 22 * * *"
    timeZone: ""
    retentionDays: 7
    image: ""
    command: []
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    resources: {}
    storage:
      existingClaim: ""
      claimName: ""
      size: 10Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      keep: true
      labels: {}
      annotations: {}

## @section External database
## @descriptionStart
## Overrides postgresql configuration.
## @descriptionEnd
## @param externalDatabase.enabled Enable using an external PostgresSQL database.
## @param externalDatabase.existingSecret Name of the Kubernetes secret containing the external PostgreSQL database credentials.
## @param externalDatabase.existingSecretPasswordKey Key in the Kubernetes secret containing the external PostgreSQL database password.
externalDatabase:
  enabled: false
  existingSecret: ""
  existingSecretPasswordKey: ""
